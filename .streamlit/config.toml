# Accessible defaults for the deployed dashboard:
# high-contrast, color-blind-safe primary, system sans-serif for legible larger text.
[theme]
base = "light"
primaryColor = "#117733"          # Okabe-Ito / "Safe" green — distinguishable in all CVD types
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f4f6"
textColor = "#1a1a1a"             # near-black on white ~ 16:1 contrast
font = "sans serif"

[server]
headless = true
